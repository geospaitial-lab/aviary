name: Check links

on:
  workflow_dispatch:
#  schedule:
#    - cron: '0 0 * * *'
#  pull_request:
#    branches:
#      - main
#    paths:
#      - '**/*.html'
#      - '**/*.ipynb'
#      - '**/*.md'
#      - '.github/workflows/check_links.yaml'
#  push:
#    branches:
#      - main
#    paths:
#      - '**/*.html'
#      - '**/*.ipynb'
#      - '**/*.md'
#      - '.github/workflows/check_links.yaml'

permissions:
  contents: read
  issues: write

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  check_links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          uv pip install --upgrade pip setuptools wheel
          uv pip install -r dev/requirements/check_links_requirements.txt

#      - name: Convert notebooks to markdown
#        run: |
#          find . -name "*.ipynb" -exec jupyter nbconvert --to markdown {} \;

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: |
            --exclude .*\/maps\/.*\.html$
            --exclude-path docs/overrides/partials/copyright.html
            --exclude-path docs/overrides/partials/logo.html
            --user-agent curl
            .
          fail: |-
            ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

      - name: Create issue
        if: |
          env.lychee_exit_code != 0 &&
          (
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'schedule'
          )
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: 'Check links failed'
          content-filepath: ./lychee/out.md
          labels: |
            docs
          assignees: |
            mrsmrynk
